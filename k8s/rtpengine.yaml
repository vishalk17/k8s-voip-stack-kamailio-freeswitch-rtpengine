apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtpengine
  namespace: sip
spec:
  replicas: 2  # HA: 2 instances on different tainted nodes
  selector:
    matchLabels:
      app: rtpengine
  template:
    metadata:
      labels:
        app: rtpengine
        rtpengine-instance: "true"  # For podAntiAffinity
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Schedule only on nodes labeled for RTPengine
      nodeSelector:
        rtpengine-node: "true"

      # Tolerate taint on RTPengine nodes
      tolerations:
        - key: rtpengine
          operator: Equal
          value: "true"
          effect: NoSchedule

      # Ensure RTPengine instances run on different nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: rtpengine-instance
                    operator: In
                    values:
                      - "true"
              topologyKey: kubernetes.io/hostname

      containers:
        - name: rtpengine
          image: readytalk/rtpengine-docker:mr6.2.1.1-39f2f23

          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - SYS_ADMIN

          env:
            - name: PRIVATE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          command:
            - /bin/sh
          args:
            - -c
            - |
              # Auto-discover public IP
              EXTERNAL_IP=$(curl -s --max-time 5 ifconfig.me || echo "${PRIVATE_IP}")
              
              echo "========================================"
              echo "RTPengine Starting"
              echo "  Private IP: ${PRIVATE_IP}"
              echo "  Public IP: ${EXTERNAL_IP}"
              echo "  Listen NG: ${PRIVATE_IP}:22222"
              echo "========================================"
              
              # Bind to private IP, advertise public IP in SDP
              /usr/sbin/rtpengine \
                --interface=${PRIVATE_IP}!${EXTERNAL_IP} \
                --listen-ng=${PRIVATE_IP}:22222 \
                --port-min=10000 \
                --port-max=20000 \
                --log-stderr \
                --foreground
