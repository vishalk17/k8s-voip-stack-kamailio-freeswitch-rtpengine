apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio
  namespace: sip
spec:
  replicas: 2  # HA: 2 replicas across different nodes
  selector:
    matchLabels:
      app: kamailio
  template:
    metadata:
      labels:
        app: kamailio
    spec:
      # Prefer to spread Kamailio replicas across different nodes
      # But allow same node if insufficient nodes available
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kamailio
                topologyKey: kubernetes.io/hostname
      containers:
        - name: kamailio
          image: ghcr.io/vishalk17/kamailio-6.0.4-bookworm:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: DBHOST
              value: postgres
            - name: DBUSER
              value: kamailio
            - name: DBPASS
              value: kamailio
          args: ["-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
          volumeMounts:
            - name: kamailio-config
              mountPath: /etc/kamailio/kamailio.cfg
              subPath: kamailio.cfg
      volumes:
        - name: kamailio-config
          configMap:
            name: kamailio-config
